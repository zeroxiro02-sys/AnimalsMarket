{% extends 'main/base.html' %}{% block title %}Kirish{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box afu">
    <div class="auth-emoji abng">🐄</div>
    <h1 class="auth-tit" data-i18n="login_title">Tizimga kirish</h1>
    <p class="auth-sub" data-i18n="login_sub">AnimalsMarket'ga xush kelibsiz!</p>

    <!-- Google login button -->
    <button class="google-btn" onclick="googleAuthNotice()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google orqali kirish
    </button>

    <div class="auth-divider"><span>yoki</span></div>

    <form method="post" id="loginForm" autocomplete="on">
      <div class="fgroup">
        <label class="flabel" data-i18n="uname_l">👤 Login</label>
        <input name="username" id="loginUser" class="fctrl" placeholder="Loginингизни киринг" required autofocus autocomplete="username"/>
      </div>
      <div class="fgroup">
        <label class="flabel" data-i18n="pass_l">🔒 Parol</label>
        <div style="position:relative">
          <input name="password" id="loginPass" type="password" class="fctrl" placeholder="••••••••" required autocomplete="current-password" style="padding-right:48px"/>
          <button type="button" class="eye-btn" onclick="togglePwd('loginPass',this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-p auth-submit-btn" data-i18n="login_btn">Kirish →</button>
    </form>
    <p style="text-align:center;font-size:14px;color:var(--mt);margin-top:20px">
      <span data-i18n="no_acc">Hisobingiz yo'qmi?</span>
      <a href="/register" style="color:var(--g);font-weight:700" data-i18n="reg_link">Ro'yxatdan o'ting</a>
    </p>
    <div class="auth-demo">
      🔑 Demo: <b>sardor</b> / <b>demo123</b> &nbsp;|&nbsp; Admin: <b>admin</b> / <b>admin123</b>
    </div>
  </div>
</div>
<style>
.google-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:13px 20px;border-radius:50px;border:2px solid var(--bdr);
  background:var(--wh);color:var(--dk);font-size:15px;font-weight:600;
  cursor:pointer;transition:all .22s;font-family:var(--fn);margin-bottom:4px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.google-btn:hover{border-color:#4285F4;box-shadow:0 4px 16px rgba(66,133,244,.2);transform:translateY(-1px)}
.google-btn:active{transform:scale(.98)}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--mt);font-size:13px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--bdr)}
.auth-submit-btn{width:100%;margin-top:8px;padding:14px;font-size:16px;border-radius:50px;justify-content:center}
</style>
<script>
function googleAuthNotice(){
  // Google OAuth placeholder - connect your OAuth credentials
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:14px 24px;border-radius:14px;z-index:9999;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px';
  t.innerHTML='<span style="font-size:18px">🔧</span> Google OAuth sozlanmoqda — tez orada!';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function togglePwd(id,btn){
  const inp=document.getElementById(id);
  if(inp.type==='password'){inp.type='text';btn.textContent='🙈';}
  else{inp.type='password';btn.textContent='👁';}
}
</script>
{% endblock %}
